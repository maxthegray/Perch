name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: bash -n Scripts/build-app.sh Scripts/release.sh Scripts/install.sh Scripts/publish-smart-perch-bridge.sh
      - run: swift test
      # TEMPORARY: capture the faulting stack for the CI-only audio crash.
      - name: Crash reports
        if: failure()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || echo "no DiagnosticReports dir"
          for f in ~/Library/Logs/DiagnosticReports/*; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done
      - run: swift build -c release
