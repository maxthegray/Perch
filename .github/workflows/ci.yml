name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: bash -n Scripts/build-app.sh Scripts/release.sh Scripts/install.sh Scripts/publish-smart-perch-bridge.sh
      - run: swift test
      # TEMPORARY: capture the faulting stack for the CI-only audio crash.
      - name: Backtrace the crash
        if: failure()
        run: |
          set +e
          swift build --build-tests
          BIN=$(swift build --show-bin-path)
          echo "===== bundle: $BIN ====="
          ls -la "$BIN" | head -20
          lldb --batch \
            -k "thread backtrace all" \
            -k "quit" \
            -o "run" \
            -- "$(xcrun -f xctest)" \
               -XCTest PerchTests.ShelfTransformTests/testExtractAudioWritesM4AWithoutChangingSource \
               "$BIN/PerchPackageTests.xctest"
          echo "===== lldb exit: $? ====="
      - run: swift build -c release
