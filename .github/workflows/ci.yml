name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta
      - smart-perch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift test
