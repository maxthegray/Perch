name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: bash -n Scripts/build-app.sh Scripts/release.sh Scripts/install.sh Scripts/publish-smart-perch-bridge.sh
      - run: swift test
      - run: swift build -c release
